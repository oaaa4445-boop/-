<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CloudShop</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <!-- Главная страница -->
    <div id="home-page" class="page active">
        <div class="header">
            <div class="search-bar">
                <span>🔍</span>
                <input type="text" placeholder="Поиск товаров" id="search-input">
            </div>
            <div class="header-actions">
                <div class="action-btn profile-btn" onclick="showProfile()">
                    <span class="action-icon">👤</span>
                </div>
                <div class="action-btn cart-btn" onclick="showCart()">
                    <span class="action-icon">🛒</span>
                    <span class="cart-badge" id="cart-badge">0</span>
                </div>
            </div>
        </div>
        
        <div class="banner">
            <div class="banner-content">
                <div class="banner-title">CLOUD SHOP</div>
                <div class="banner-subtitle">Лучшие цены в Екб</div>
            </div>
        </div>
        
        <h2 class="section-title">Категории</h2>
        <div class="categories-grid" id="categories-grid">
            <div class="loading">Загрузка...</div>
        </div>
    </div>

    <!-- Страница категории -->
    <div id="category-page" class="page">
        <div class="top-bar">
            <button class="back-btn" onclick="goHome()">← Назад</button>
            <h2 id="category-title">Категория</h2>
        </div>
        <div class="products-grid" id="products-grid">
            <div class="loading">Загрузка товаров...</div>
        </div>
    </div>

    <!-- Страница корзины -->
    <div id="cart-page" class="page">
        <div class="top-bar">
            <button class="back-btn" onclick="goHome()">← Назад</button>
            <h2>🛒 Корзина</h2>
        </div>
        <div id="cart-items">
            <div class="empty-cart">Корзина пуста</div>
        </div>
        <div class="cart-footer">
            <div class="cart-total">Итого: <span id="total-price">0</span> ₽</div>
            <button class="checkout-btn" onclick="checkout()">Оформить заказ</button>
        </div>
    </div>

    <!-- Страница профиля -->
    <div id="profile-page" class="page">
        <div class="top-bar">
            <button class="back-btn" onclick="goHome()">← Назад</button>
            <h2>👤 Профиль</h2>
        </div>
        <div class="profile-content">
            <div class="profile-avatar" id="profile-avatar">👤</div>
            <div class="profile-name" id="profile-name">Гость</div>
            <div class="profile-username" id="profile-username">@username</div>
            
            <div class="profile-stats">
                <div class="stat-item">
                    <div class="stat-value" id="stat-orders">0</div>
                    <div class="stat-label">Заказов</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="stat-spent">0 ₽</div>
                    <div class="stat-label">Потрачено</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="stat-favorites">0</div>
                    <div class="stat-label">Избранное</div>
                </div>
            </div>
            
            <div class="profile-menu">
                <div class="menu-item" onclick="showCart()">
                    <span class="menu-icon">🛒</span>
                    <span class="menu-text">Мои заказы</span>
                    <span class="menu-arrow">›</span>
                </div>
                <div class="menu-item" onclick="showFavorites()">
                    <span class="menu-icon">❤️</span>
                    <span class="menu-text">Избранное</span>
                    <span class="menu-arrow">›</span>
                </div>
                <div class="menu-item" onclick="openSupport()">
                    <span class="menu-icon"></span>
                    <span class="menu-text">Поддержка</span>
                    <span class="menu-arrow">›</span>
                </div>
                <div class="menu-item" onclick="showAbout()">
                    <span class="menu-icon">️</span>
                    <span class="menu-text">О магазине</span>
                    <span class="menu-arrow">›</span>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
